<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#F6F3EC">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotebookLM 蔵書目録 — スマートランチャー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: {
              bg: '#F6F3EC',
              surface: '#FBF9F4',
              hover: '#EFEAE0',
              border: '#DDD7CC',
            },
            ink: {
              main: '#1E1B18',
              muted: '#6B655D',
              faint: '#9A9389',
            },
            vermilion: {
              DEFAULT: '#B83B2A',
              dark: '#D85A46',
              soft: '#F5E5E2',
            },
            night: {
              bg: '#141210',
              surface: '#1B1815',
              hover: '#24201C',
              border: '#2E2A25',
              ink: '#EAE4D7',
              muted: '#9B9285',
            },
          },
          fontFamily: {
            serif: ['"Shippori Mincho"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            sans: ['"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      overflow-x: hidden;
      font-feature-settings: "palt" 1;
    }
    .index-row {
      box-shadow: inset 2px 0 0 0 transparent;
      transition: background-color 0.14s ease, box-shadow 0.14s ease;
    }
    .index-row:hover {
      box-shadow: inset 2px 0 0 0 #B83B2A;
    }
    .dark .index-row:hover {
      box-shadow: inset 2px 0 0 0 #D85A46;
    }
    .index-row.is-pinned {
      box-shadow: inset 2px 0 0 0 #B83B2A;
    }
    .dark .index-row.is-pinned {
      box-shadow: inset 2px 0 0 0 #D85A46;
    }
    .cat-btn {
      border-left: 2px solid transparent;
      transition: color 0.14s ease, border-left-color 0.14s ease, background-color 0.14s ease;
    }
    .cat-btn.is-active {
      border-left-color: #B83B2A;
    }
    .dark .cat-btn.is-active {
      border-left-color: #D85A46;
    }
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen bg-paper-bg text-ink-main dark:bg-night-bg dark:text-night-ink transition-colors duration-200">
  <div class="max-w-7xl mx-auto min-h-screen flex flex-col lg:flex-row">
    <!-- Left Sidebar (Fixed Category Index on Desktop, Top Drawer on Mobile) -->
    <aside class="lg:w-72 lg:shrink-0 lg:sticky lg:top-0 lg:h-screen lg:overflow-y-auto border-b lg:border-b-0 lg:border-r border-paper-border dark:border-night-border bg-paper-surface dark:bg-night-surface px-5 py-6 flex flex-col justify-between gap-6">
      <div class="space-y-6">
        <!-- Masthead -->
        <div class="space-y-1.5 pb-4 border-b border-paper-border dark:border-night-border">
          <div class="flex items-center justify-between gap-2">
            <p class="font-mono text-[11px] tracking-[0.18em] uppercase text-ink-muted dark:text-night-muted">INDEX / ARCHIVE</p>
            <button
              id="btnTheme"
              type="button"
              title="紙面（ライト）／夜の書斎（ダーク）を切替"
              class="font-mono text-[11px] px-2 py-1 border border-paper-border dark:border-night-border text-ink-muted dark:text-night-muted hover:text-ink-main dark:hover:text-night-ink hover:border-ink-main dark:hover:border-night-ink transition whitespace-nowrap"
            >
              夜モード
            </button>
          </div>
          <h1 class="font-serif text-2xl font-bold tracking-tight leading-snug">蔵書目録</h1>
          <p class="text-xs text-ink-muted dark:text-night-muted leading-relaxed">
            NotebookLM 全巻索引。開いた回数と閲覧順で、よく使う書架が自動で上へ並びます。
          </p>
        </div>

        <!-- Category Navigation -->
        <nav aria-label="カテゴリ目次" class="space-y-1">
          <div class="flex items-center justify-between pb-1.5">
            <span class="font-mono text-[11px] tracking-widest uppercase text-ink-muted dark:text-night-muted">書架カテゴリ</span>
            <button id="btnMobileCatToggle" type="button" class="lg:hidden font-mono text-[11px] text-vermilion dark:text-vermilion-dark underline">
              開閉
            </button>
          </div>
          <div id="categoryBar" class="space-y-0.5"></div>
        </nav>

        <!-- Sidebar Quick Filters & Actions -->
        <div class="pt-4 border-t border-paper-border dark:border-night-border space-y-3">
          <label class="flex items-center justify-between gap-2 text-xs text-ink-main dark:text-night-ink cursor-pointer select-none py-1">
            <span class="flex items-center gap-2">
              <input id="chkPinnedOnly" type="checkbox" class="accent-[#B83B2A] w-3.5 h-3.5" />
              <span>ピン留めのみ表示</span>
            </span>
            <span id="pinnedCountBadge" class="font-mono text-[11px] text-vermilion dark:text-vermilion-dark tabular">0</span>
          </label>

          <div class="space-y-2">
            <button
              id="btnAddNotebook"
              type="button"
              class="w-full px-3 py-2 text-xs font-medium bg-ink-main text-paper-surface dark:bg-night-ink dark:text-night-bg hover:bg-vermilion dark:hover:bg-vermilion-dark dark:hover:text-white transition whitespace-nowrap"
            >
              ＋ ノート追加
            </button>
            <div class="grid grid-cols-2 gap-2">
              <button
                id="btnExport"
                type="button"
                title="ピン留め・利用回数データをJSON書き出し"
                class="px-2.5 py-2 text-xs font-medium border border-paper-border dark:border-night-border text-ink-main dark:text-night-ink hover:border-ink-main dark:hover:border-night-ink transition whitespace-nowrap"
              >
                JSON保存
              </button>
              <button
                id="btnImport"
                type="button"
                title="他端末のJSONを読み込んでピン留め・利用回数を同期"
                class="px-2.5 py-2 text-xs font-medium border border-paper-border dark:border-night-border text-ink-main dark:text-night-ink hover:border-vermilion dark:hover:border-vermilion-dark hover:text-vermilion dark:hover:text-vermilion-dark transition whitespace-nowrap"
              >
                JSON読込
              </button>
              <input id="importFileInput" type="file" accept=".json,application/json" class="hidden" />
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Utilities -->
      <div class="pt-4 border-t border-paper-border dark:border-night-border flex items-center justify-between text-[11px] text-ink-muted dark:text-night-muted">
        <span class="font-mono tabular">無制限ピン留め対応</span>
        <button id="btnResetStats" type="button" class="hover:text-vermilion dark:hover:text-vermilion-dark underline underline-offset-2 transition">
          回数リセット
        </button>
      </div>
    </aside>

    <!-- Right Main Editorial Index -->
    <main class="flex-1 min-w-0 px-5 sm:px-8 lg:px-10 py-6 sm:py-8 space-y-8">
      <!-- Search & Sort Strip -->
      <section class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-5 border-b border-ink-main/20 dark:border-night-ink/20">
        <div class="relative flex-1 max-w-xl">
          <label for="searchInput" class="block font-mono text-[10px] tracking-widest uppercase text-ink-muted dark:text-night-muted mb-1">
            SEARCH ( / KEY )
          </label>
          <div class="relative">
            <input
              id="searchInput"
              type="text"
              placeholder="書名・カテゴリで絞り込む…"
              class="w-full pr-8 py-2 text-sm bg-transparent border-b border-paper-border dark:border-night-border focus:border-vermilion dark:focus:border-vermilion-dark focus:outline-none placeholder:text-ink-faint dark:placeholder:text-night-muted/60 transition"
            />
            <button
              id="btnClearSearch"
              type="button"
              aria-label="検索をクリア"
              class="hidden absolute right-1 top-1/2 -translate-y-1/2 font-mono text-xs text-ink-muted hover:text-ink-main dark:hover:text-night-ink px-1"
            >
              ✕
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
          <label for="sortSelect" class="font-mono text-[10px] tracking-widest uppercase text-ink-muted dark:text-night-muted whitespace-nowrap">
            SORT
          </label>
          <select
            id="sortSelect"
            class="py-2 pl-2 pr-7 text-xs font-medium bg-paper-surface dark:bg-night-surface border border-paper-border dark:border-night-border focus:border-vermilion dark:focus:border-vermilion-dark focus:outline-none"
          >
            <option value="smart">自動上位（頻度＋最近）</option>
            <option value="clicks">よく使う順（クリック数）</option>
            <option value="recent">最近開いた順</option>
            <option value="sources">ソース数が多い順</option>
          </select>
        </div>
      </section>

      <!-- Pinned Shelf (Dedicated Unlimited Pins) -->
      <section id="pinnedShelfSection" class="space-y-3">
        <div class="flex items-baseline justify-between gap-2 pb-2 border-b border-paper-border dark:border-night-border">
          <div class="flex items-baseline gap-3">
            <h2 class="font-serif text-lg sm:text-xl font-bold tracking-tight">固定した書架</h2>
            <span id="pinnedShelfBadge" class="font-mono text-[11px] text-vermilion dark:text-vermilion-dark tabular">0 件</span>
          </div>
          <button id="btnTogglePinned" type="button" class="font-mono text-[11px] text-ink-muted dark:text-night-muted hover:text-ink-main dark:hover:text-night-ink transition">
            折りたたむ
          </button>
        </div>
        <div id="pinnedShelfGrid" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-0"></div>
        <p id="pinnedEmptyHint" class="hidden text-xs text-ink-muted dark:text-night-muted py-2">
          固定した書架はまだありません。各行右端の「固定」から無制限に登録できます。
        </p>
      </section>

      <!-- Auto-Ranked Shelf (Strictly Excludes Pinned Items) -->
      <section id="autoShelfSection" class="space-y-3">
        <div class="flex items-baseline justify-between gap-2 pb-2 border-b border-paper-border dark:border-night-border">
          <div class="flex items-baseline gap-3 flex-wrap">
            <h2 class="font-serif text-lg sm:text-xl font-bold tracking-tight">よく使う書架</h2>
            <span id="autoShelfBadge" class="font-mono text-[11px] text-ink-muted dark:text-night-muted tabular">自動上位・固定を除く TOP 8</span>
          </div>
          <button id="btnToggleAuto" type="button" class="font-mono text-[11px] text-ink-muted dark:text-night-muted hover:text-ink-main dark:hover:text-night-ink transition">
            折りたたむ
          </button>
        </div>
        <div id="autoShelfGrid" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-0"></div>
      </section>

      <!-- Full Editorial Index List -->
      <section class="space-y-3">
        <div class="flex items-baseline justify-between gap-2 pb-2 border-b border-ink-main/30 dark:border-night-ink/30">
          <div class="flex items-baseline gap-3 min-w-0">
            <h2 id="mainGridTitle" class="font-serif text-lg sm:text-xl font-bold tracking-tight truncate">すべての書架</h2>
            <span id="resultCount" class="font-mono text-xs text-ink-muted dark:text-night-muted tabular shrink-0"></span>
          </div>
          <div class="hidden sm:grid grid-cols-[6.5rem_4.5rem_5.5rem_3.5rem] gap-3 font-mono text-[10px] tracking-wider uppercase text-ink-muted dark:text-night-muted text-right shrink-0">
            <span>カテゴリ</span>
            <span>ソース</span>
            <span>最終閲覧</span>
            <span>固定</span>
          </div>
        </div>

        <div id="notebookGrid" class="divide-y divide-paper-border dark:divide-night-border"></div>

        <div id="emptyState" class="hidden py-14 text-center border-b border-paper-border dark:border-night-border">
          <p class="font-serif text-base text-ink-muted dark:text-night-muted">該当する書架が見当たりませんでした。</p>
          <p class="text-xs text-ink-faint dark:text-night-muted/70 mt-1">検索語を変えるか、左の「すべて」から選び直してみてください。</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Add Notebook Modal -->
  <div id="addModal" class="hidden fixed inset-0 z-50 bg-ink-main/60 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-paper-surface dark:bg-night-surface border border-paper-border dark:border-night-border p-6 space-y-5 shadow-xl">
      <div class="flex items-center justify-between pb-3 border-b border-paper-border dark:border-night-border">
        <h3 class="font-serif text-lg font-bold">新しい書架を登録</h3>
        <button id="btnCloseModal" type="button" class="font-mono text-sm text-ink-muted hover:text-ink-main dark:hover:text-night-ink">✕</button>
      </div>
      <form id="addNotebookForm" class="space-y-4">
        <div>
          <label for="inputTitle" class="block font-mono text-[11px] uppercase tracking-wider text-ink-muted dark:text-night-muted mb-1">ノートブック名</label>
          <input id="inputTitle" type="text" required placeholder="例：SS_新シリーズ" class="w-full px-3 py-2 text-sm bg-paper-bg dark:bg-night-bg border border-paper-border dark:border-night-border focus:border-vermilion dark:focus:border-vermilion-dark focus:outline-none" />
        </div>
        <div>
          <label for="inputUrl" class="block font-mono text-[11px] uppercase tracking-wider text-ink-muted dark:text-night-muted mb-1">URL</label>
          <input id="inputUrl" type="url" required placeholder="https://gemini.google.com/notebook/..." class="w-full px-3 py-2 text-sm font-mono bg-paper-bg dark:bg-night-bg border border-paper-border dark:border-night-border focus:border-vermilion dark:focus:border-vermilion-dark focus:outline-none" />
        </div>
        <div>
          <label for="inputCategory" class="block font-mono text-[11px] uppercase tracking-wider text-ink-muted dark:text-night-muted mb-1">カテゴリ</label>
          <select id="inputCategory" class="w-full px-3 py-2 text-sm bg-paper-bg dark:bg-night-bg border border-paper-border dark:border-night-border focus:border-vermilion dark:focus:border-vermilion-dark focus:outline-none">
            <option value="統括・生活">統括・生活</option>
            <option value="まどマギSS・二次創作">まどマギSS・二次創作</option>
            <option value="商業・一次創作">商業・一次創作</option>
            <option value="創作ノウハウ・資料">創作ノウハウ・資料</option>
            <option value="司法試験・公務員試験">司法試験・公務員試験</option>
            <option value="読書・作品リファレンス">読書・作品リファレンス</option>
            <option value="哲学・思考・その他">哲学・思考・その他</option>
          </select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button id="btnCancelModal" type="button" class="px-4 py-2 text-xs font-medium border border-paper-border dark:border-night-border text-ink-muted hover:text-ink-main dark:hover:text-night-ink">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-xs font-medium bg-ink-main text-paper-surface dark:bg-night-ink dark:text-night-bg hover:bg-vermilion dark:hover:bg-vermilion-dark dark:hover:text-white transition">追加する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 px-4 py-2.5 text-xs font-medium bg-ink-main text-paper-surface dark:bg-night-ink dark:text-night-bg border-l-2 border-vermilion dark:border-vermilion-dark shadow-lg"></div>

    const state = {
      activeCategory: 'ALL',
      searchQuery: '',
      sortBy: 'smart',
      pinnedOnly: false,
      pinnedCollapsed: false,
      autoCollapsed: false,
      mobileCatOpen: true,
      theme: 'light', // Editorial paper-and-ink default
      usage: {},
      customNotebooks: [],
    };

    function loadPersisted() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.usage && typeof parsed.usage === 'object') state.usage = parsed.usage;
        if (Array.isArray(parsed.customNotebooks)) state.customNotebooks = parsed.customNotebooks;
        if (parsed.theme === 'light' || parsed.theme === 'dark') state.theme = parsed.theme;
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    function savePersisted() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          usage: state.usage,
          customNotebooks: state.customNotebooks,
          theme: state.theme,
        }));
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    function getAllNotebooks() {
      return [...state.customNotebooks, ...DEFAULT_NOTEBOOKS].map((nb) => {
        const meta = state.usage[nb.id] || { clicks: 0, lastClicked: null, pinned: false };
        const effectiveTime = meta.lastClicked || nb.lastViewed || '2025-01-01T00:00:00Z';
        return {
          ...nb,
          clicks: meta.clicks || 0,
          lastClicked: meta.lastClicked || null,
          pinned: Boolean(meta.pinned),
          effectiveTime,
          effectiveTs: Date.parse(effectiveTime) || 0,
        };
      });
    }

    function computeAutoScore(nb) {
      const clickBonus = nb.clicks * 1e11;
      return clickBonus + nb.effectiveTs;
    }

    function sortNotebooks(list, mode) {
      const copy = [...list];
      if (mode === 'smart') {
        copy.sort((a, b) => computeAutoScore(b) - computeAutoScore(a));
      } else if (mode === 'clicks') {
        copy.sort((a, b) => (b.clicks - a.clicks) || (b.effectiveTs - a.effectiveTs));
      } else if (mode === 'recent') {
        copy.sort((a, b) => b.effectiveTs - a.effectiveTs);
      } else if (mode === 'sources') {
        copy.sort((a, b) => (b.sources - a.sources) || (b.effectiveTs - a.effectiveTs));
      }
      return copy;
    }

    function formatShortDate(iso) {
      if (!iso) return '----/--/--';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '----/--/--';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}.${m}.${day}`;
    }

    function getShortCategory(catId) {
      const found = CATEGORIES.find((c) => c.id === catId);
      return found ? found.short : catId;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('hidden');
      }, 2400);
    }

    function recordClick(id) {
      const prev = state.usage[id] || { clicks: 0, lastClicked: null, pinned: false };
      state.usage[id] = {
        ...prev,
        clicks: (prev.clicks || 0) + 1,
        lastClicked: new Date().toISOString(),
      };
      savePersisted();
      render();
    }

    function togglePin(id) {
      const prev = state.usage[id] || { clicks: 0, lastClicked: null, pinned: false };
      const nextPinned = !prev.pinned;
      state.usage[id] = { ...prev, pinned: nextPinned };
      savePersisted();
      showToast(nextPinned ? '書架を上位に固定しました' : '固定を解除しました');
      render();
    }

    function renderCategoryBar(all) {
      const bar = document.getElementById('categoryBar');
      bar.classList.toggle('hidden', !state.mobileCatOpen && window.innerWidth < 1024);

      const counts = { ALL: all.length };
      all.forEach((nb) => {
        counts[nb.category] = (counts[nb.category] || 0) + 1;
      });

      bar.innerHTML = CATEGORIES.map((cat) => {
        const active = state.activeCategory === cat.id;
        const count = counts[cat.id] || 0;
        const activeCls = active
          ? 'is-active text-vermilion dark:text-vermilion-dark font-semibold bg-paper-hover/70 dark:bg-night-hover/70'
          : 'text-ink-muted dark:text-night-muted hover:text-ink-main dark:hover:text-night-ink hover:bg-paper-hover/40 dark:hover:bg-night-hover/40';
        return `
          <button
            type="button"
            data-cat="${escapeHtml(cat.id)}"
            class="cat-btn cat-pill w-full flex items-center justify-between gap-2 pl-3 pr-2 py-1.5 text-left text-xs ${activeCls}"
          >
            <span class="truncate">${escapeHtml(cat.label)}</span>
            <span class="font-mono text-[11px] tabular opacity-80">${String(count).padStart(2, '0')}</span>
          </button>
        `;
      }).join('');
    }

    function createQuickRowHtml(nb, rank) {
      const pinLabel = nb.pinned ? '固定中' : '固定';
      const pinCls = nb.pinned
        ? 'text-vermilion dark:text-vermilion-dark font-medium'
        : 'text-ink-faint dark:text-night-muted/60 hover:text-ink-main dark:hover:text-night-ink';
      const clicksText = nb.clicks > 0 ? `${nb.clicks}回` : formatShortDate(nb.effectiveTime);

      return `
        <div class="index-row ${nb.pinned ? 'is-pinned' : ''} flex items-baseline justify-between gap-3 pl-3 pr-1 py-2.5 border-b border-paper-border dark:border-night-border hover:bg-paper-hover/70 dark:hover:bg-night-hover/70">
          <a
            href="${escapeHtml(nb.url)}"
            target="_blank"
            rel="noopener noreferrer"
            data-open-id="${escapeHtml(nb.id)}"
            class="nb-open-link flex items-baseline gap-2.5 min-w-0 flex-1 group"
          >
            <span class="font-mono text-[11px] text-ink-faint dark:text-night-muted/70 tabular shrink-0">${String(rank).padStart(2, '0')}</span>
            <span class="font-serif text-sm font-semibold leading-snug truncate group-hover:text-vermilion dark:group-hover:text-vermilion-dark transition">${escapeHtml(nb.title)}</span>
          </a>
          <div class="flex items-baseline gap-2.5 shrink-0 font-mono text-[11px] tabular">
            <span class="${nb.clicks > 0 ? 'text-vermilion dark:text-vermilion-dark font-medium' : 'text-ink-muted dark:text-night-muted'}">${clicksText}</span>
            <button
              type="button"
              data-pin-id="${escapeHtml(nb.id)}"
              class="nb-pin-btn text-[11px] transition whitespace-nowrap ${pinCls}"
            >${pinLabel}</button>
          </div>
        </div>
      `;
    }

    function createIndexRowHtml(nb) {
      const pinLabel = nb.pinned ? '固定中' : '固定';
      const pinCls = nb.pinned
        ? 'text-vermilion dark:text-vermilion-dark font-medium'
        : 'text-ink-faint dark:text-night-muted/60 hover:text-ink-main dark:hover:text-night-ink';
      const clicksBadge = nb.clicks > 0
        ? `<span class="font-mono text-[11px] text-vermilion dark:text-vermilion-dark tabular ml-2">[${nb.clicks}回]</span>`
        : '';

      return `
        <div class="index-row ${nb.pinned ? 'is-pinned' : ''} pl-3 pr-1 py-3 flex flex-col sm:flex-row sm:items-baseline justify-between gap-1.5 sm:gap-4 hover:bg-paper-hover/70 dark:hover:bg-night-hover/70">
          <a
            href="${escapeHtml(nb.url)}"
            target="_blank"
            rel="noopener noreferrer"
            data-open-id="${escapeHtml(nb.id)}"
            class="nb-open-link min-w-0 flex-1 group"
          >
            <span class="font-serif text-[15px] font-medium leading-snug group-hover:text-vermilion dark:group-hover:text-vermilion-dark transition">${escapeHtml(nb.title)}</span>${clicksBadge}
          </a>

          <div class="flex items-center sm:grid sm:grid-cols-[6.5rem_4.5rem_5.5rem_3.5rem] gap-3 font-mono text-[11px] text-ink-muted dark:text-night-muted sm:text-right tabular shrink-0">
            <span class="truncate">${escapeHtml(getShortCategory(nb.category))}</span>
            <span>${nb.sources}件</span>
            <span>${formatShortDate(nb.effectiveTime)}</span>
            <button
              type="button"
              data-pin-id="${escapeHtml(nb.id)}"
              class="nb-pin-btn text-right transition whitespace-nowrap ${pinCls}"
            >${pinLabel}</button>
          </div>
        </div>
      `;
    }

    function applyTheme() {
      const root = document.documentElement;
      const btn = document.getElementById('btnTheme');
      if (state.theme === 'dark') {
        root.classList.add('dark');
        btn.textContent = '紙面モード';
      } else {
        root.classList.remove('dark');
        btn.textContent = '夜モード';
      }
    }

    function render() {
      applyTheme();
      const all = getAllNotebooks();
      renderCategoryBar(all);

      const pinnedCount = all.filter((n) => n.pinned).length;
      document.getElementById('pinnedCountBadge').textContent = String(pinnedCount);

      // Separate Pinned Shelf & Auto-Ranked Shelf (excluding pinned)
      const pinnedShelfSection = document.getElementById('pinnedShelfSection');
      const pinnedShelfGrid = document.getElementById('pinnedShelfGrid');
      const pinnedEmptyHint = document.getElementById('pinnedEmptyHint');
      const pinnedToggleBtn = document.getElementById('btnTogglePinned');

      const autoShelfSection = document.getElementById('autoShelfSection');
      const autoShelfGrid = document.getElementById('autoShelfGrid');
      const autoToggleBtn = document.getElementById('btnToggleAuto');

      const pinnedItems = sortNotebooks(all.filter((n) => n.pinned), 'smart');
      const autoTop8 = sortNotebooks(all.filter((n) => !n.pinned), 'smart').slice(0, 8);

      document.getElementById('pinnedShelfBadge').textContent = `${pinnedItems.length} 件`;
      document.getElementById('autoShelfBadge').textContent = `自動上位・固定を除く TOP ${autoTop8.length}`;

      const isFilteredView = state.searchQuery.trim() !== '' || state.activeCategory !== 'ALL' || state.pinnedOnly;
      if (isFilteredView) {
        pinnedShelfSection.classList.add('hidden');
        autoShelfSection.classList.add('hidden');
      } else {
        pinnedShelfSection.classList.remove('hidden');
        autoShelfSection.classList.remove('hidden');

        if (state.pinnedCollapsed) {
          pinnedShelfGrid.classList.add('hidden');
          pinnedEmptyHint.classList.add('hidden');
          pinnedToggleBtn.textContent = '開く';
        } else {
          pinnedToggleBtn.textContent = '折りたたむ';
          if (pinnedItems.length === 0) {
            pinnedShelfGrid.innerHTML = '';
            pinnedShelfGrid.classList.add('hidden');
            pinnedEmptyHint.classList.remove('hidden');
          } else {
            pinnedEmptyHint.classList.add('hidden');
            pinnedShelfGrid.classList.remove('hidden');
            pinnedShelfGrid.innerHTML = pinnedItems.map((nb, idx) => createQuickRowHtml(nb, idx + 1)).join('');
          }
        }

        if (state.autoCollapsed) {
          autoShelfGrid.classList.add('hidden');
          autoToggleBtn.textContent = '開く';
        } else {
          autoShelfGrid.classList.remove('hidden');
          autoToggleBtn.textContent = '折りたたむ';
          autoShelfGrid.innerHTML = autoTop8.map((nb, idx) => createQuickRowHtml(nb, idx + 1)).join('');
        }
      }

      // Main List Filtering & Sorting
      const q = state.searchQuery.trim().toLowerCase();
      let filtered = all.filter((nb) => {
        if (state.activeCategory !== 'ALL' && nb.category !== state.activeCategory) return false;
        if (state.pinnedOnly && !nb.pinned) return false;
        if (q) {
          const hay = `${nb.title} ${nb.category}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      filtered = sortNotebooks(filtered, state.sortBy);

      const mainTitle = state.activeCategory === 'ALL' ? 'すべての書架' : state.activeCategory;
      document.getElementById('mainGridTitle').textContent = mainTitle;
      document.getElementById('resultCount').textContent = `${filtered.length} 件`;

      const grid = document.getElementById('notebookGrid');
      const emptyState = document.getElementById('emptyState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        grid.innerHTML = filtered.map((nb) => createIndexRowHtml(nb)).join('');
      }
    }

    // Event delegation
    document.addEventListener('click', (e) => {
      const catBtn = e.target.closest('.cat-pill');
      if (catBtn) {
        state.activeCategory = catBtn.dataset.cat;
        render();
        return;
      }

      const pinBtn = e.target.closest('.nb-pin-btn');
      if (pinBtn) {
        e.preventDefault();
        togglePin(pinBtn.dataset.pinId);
        return;
      }

      const openLink = e.target.closest('.nb-open-link');
      if (openLink) {
        recordClick(openLink.dataset.openId);
      }
    });

    const searchInput = document.getElementById('searchInput');
    const btnClearSearch = document.getElementById('btnClearSearch');
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      btnClearSearch.classList.toggle('hidden', state.searchQuery === '');
      render();
    });

    btnClearSearch.addEventListener('click', () => {
      state.searchQuery = '';
      searchInput.value = '';
      btnClearSearch.classList.add('hidden');
      render();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      state.sortBy = e.target.value;
      render();
    });

    document.getElementById('chkPinnedOnly').addEventListener('change', (e) => {
      state.pinnedOnly = e.target.checked;
      render();
    });

    document.getElementById('btnTogglePinned').addEventListener('click', () => {
      state.pinnedCollapsed = !state.pinnedCollapsed;
      render();
    });

    document.getElementById('btnToggleAuto').addEventListener('click', () => {
      state.autoCollapsed = !state.autoCollapsed;
      render();
    });

    document.getElementById('btnMobileCatToggle').addEventListener('click', () => {
      state.mobileCatOpen = !state.mobileCatOpen;
      render();
    });

    document.getElementById('btnTheme').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      savePersisted();
      render();
    });

    document.getElementById('btnResetStats').addEventListener('click', () => {
      Object.keys(state.usage).forEach((k) => {
        state.usage[k] = { ...state.usage[k], clicks: 0, lastClicked: null };
      });
      savePersisted();
      showToast('利用回数をリセットしました（固定は維持されます）');
      render();
    });

    document.getElementById('btnExport').addEventListener('click', () => {
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        usage: state.usage,
        customNotebooks: state.customNotebooks,
      }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'notebooklm_launcher_backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('ピン留め・利用回数データをJSON保存しました');
    });

    const importFileInput = document.getElementById('importFileInput');
    document.getElementById('btnImport').addEventListener('click', () => {
      importFileInput.value = '';
      importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          if (!parsed || (typeof parsed.usage !== 'object' && !Array.isArray(parsed.customNotebooks))) {
            showToast('読み込めない形式のJSONファイルです');
            return;
          }
          if (parsed.usage && typeof parsed.usage === 'object') {
            Object.entries(parsed.usage).forEach(([id, incoming]) => {
              if (!incoming || typeof incoming !== 'object') return;
              const prev = state.usage[id] || { clicks: 0, lastClicked: null, pinned: false };
              const prevTs = Date.parse(prev.lastClicked || '') || 0;
              const incTs = Date.parse(incoming.lastClicked || '') || 0;
              state.usage[id] = {
                clicks: Math.max(Number(prev.clicks) || 0, Number(incoming.clicks) || 0),
                lastClicked: incTs >= prevTs ? (incoming.lastClicked || prev.lastClicked) : prev.lastClicked,
                pinned: Boolean(incoming.pinned),
              };
            });
          }
          if (Array.isArray(parsed.customNotebooks)) {
            const existingUrls = new Set(getAllNotebooks().map((n) => n.url));
            parsed.customNotebooks.forEach((nb) => {
              if (nb && nb.title && nb.url && !existingUrls.has(nb.url)) {
                state.customNotebooks.unshift({
                  id: nb.id || ('custom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
                  title: String(nb.title),
                  url: String(nb.url),
                  category: String(nb.category || '統括・生活'),
                  sources: Number(nb.sources) || 1,
                  lastViewed: nb.lastViewed || new Date().toISOString(),
                });
                existingUrls.add(nb.url);
              }
            });
          }
          savePersisted();
          render();
          showToast('JSONを読み込み、ピン留めと利用回数を反映しました');
        } catch (err) {
          showToast('JSONの解析に失敗しました');
        }
      };
      reader.readAsText(file, 'utf-8');
    });

    // Modal handlers
    const addModal = document.getElementById('addModal');
    function openModal() {
      addModal.classList.remove('hidden');
      document.getElementById('inputTitle').focus();
    }
    function closeModal() {
      addModal.classList.add('hidden');
      document.getElementById('addNotebookForm').reset();
    }

    document.getElementById('btnAddNotebook').addEventListener('click', openModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnCancelModal').addEventListener('click', closeModal);
    addModal.addEventListener('click', (e) => {
      if (e.target === addModal) closeModal();
    });

    document.getElementById('addNotebookForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value.trim();
      const url = document.getElementById('inputUrl').value.trim();
      const category = document.getElementById('inputCategory').value;
      if (!title || !url) return;

      const id = 'custom_' + Date.now();
      state.customNotebooks.unshift({
        id,
        title,
        url,
        category,
        sources: 1,
        lastViewed: new Date().toISOString(),
      });
      state.usage[id] = { clicks: 1, lastClicked: new Date().toISOString(), pinned: false };
      savePersisted();
      closeModal();
      showToast(`「${title}」を書架に追加しました`);
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && !addModal.classList.contains('hidden')) {
        closeModal();
      }
    });

    window.addEventListener('resize', () => {
      const bar = document.getElementById('categoryBar');
      if (window.innerWidth >= 1024) {
        bar.classList.remove('hidden');
      }
    });

    loadPersisted();
    render();
  </script>
</body>
</html>
